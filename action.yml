name: 'Run Snyk monitor on a Gradle project'
description: 'This is an action that runs snyk monitor on a Gradle project and fails instead of uploading an incomplete dependency graph.'

inputs:
  snyk-token:
    required: true
    description: "The token used to authenticate with Snyk"
  org:
    required: true
    description: "The Snyk organization to monitor into"
  project-name:
    required: false
    description: "The name of the Snyk project, required unless sub-project is set"
  remote-repo-url:
    required: true
    description: "The Snyk target that groups the project"
  project-lifecycle:
    required: true
    description: "The lifecycle of the Snyk project, development or production"
  target-reference:
    default: ${{ github.ref_name }}
    required: false
    description: "The reference of the project within its target, like a branch or a version"
  path:
    default: "."
    required: false
    description: "The directory of the Gradle build"
  sub-project:
    default: ""
    required: false
    description: "The Gradle sub-project to monitor; without project-name, Snyk derives the project name"
  configuration-matching:
    default: "^runtimeClasspath$"
    required: false
    description: "Pattern of the Gradle configurations to scan"

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      run: |
        fail() {
          echo "::error::$1"
          exit 1
        }
        [[ -n "${SNYK_TOKEN}" ]] || fail "The snyk-token input is required"
        [[ -n "${ORG}" ]] || fail "The org input is required"
        [[ -n "${PROJECT_NAME}" || -n "${SUB_PROJECT}" ]] || fail "The project-name input is required unless sub-project is set"
        [[ -n "${REMOTE_REPO_URL}" ]] || fail "The remote-repo-url input is required"
        [[ "${PROJECT_LIFECYCLE}" == development || "${PROJECT_LIFECYCLE}" == production ]] || fail "The project-lifecycle input must be development or production"
        [[ -n "${TARGET_REFERENCE}" ]] || fail "The target-reference input must not be empty"
        [[ -n "${MONITOR_PATH}" ]] || fail "The path input must not be empty"
        [[ -n "${CONFIGURATION_MATCHING}" ]] || fail "The configuration-matching input must not be empty"
        if [[ -f "${MONITOR_PATH}/build.gradle" ]]; then
          echo "build-file=build.gradle" >> "${GITHUB_OUTPUT}"
        elif [[ -f "${MONITOR_PATH}/build.gradle.kts" ]]; then
          echo "build-file=build.gradle.kts" >> "${GITHUB_OUTPUT}"
        else
          fail "The path ${MONITOR_PATH} contains no build.gradle or build.gradle.kts"
        fi
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
        ORG: ${{ inputs.org }}
        PROJECT_NAME: ${{ inputs.project-name }}
        SUB_PROJECT: ${{ inputs.sub-project }}
        REMOTE_REPO_URL: ${{ inputs.remote-repo-url }}
        PROJECT_LIFECYCLE: ${{ inputs.project-lifecycle }}
        TARGET_REFERENCE: ${{ inputs.target-reference }}
        MONITOR_PATH: ${{ inputs.path }}
        CONFIGURATION_MATCHING: ${{ inputs.configuration-matching }}

    - name: Setup Snyk
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1

    - name: Run Snyk monitor
      shell: bash
      run: |
        options=(
          # Snyk prefers other manifests in the same directory, like package.json or pom.xml, over the Gradle build file
          "--file=${BUILD_FILE}"
          "--org=${ORG}"
          "--remote-repo-url=${REMOTE_REPO_URL}"
          "--project-lifecycle=${PROJECT_LIFECYCLE}"
          "--target-reference=${TARGET_REFERENCE}"
          "--configuration-matching=${CONFIGURATION_MATCHING}"
          -d
        )
        if [[ -n "${PROJECT_NAME}" ]]; then
          options+=("--project-name=${PROJECT_NAME}")
        fi
        if [[ -n "${SUB_PROJECT}" ]]; then
          options+=("--sub-project=${SUB_PROJECT}")
        fi
        # Snyk's test flow drops the path argument when --file is set, so the monitor runs in the build directory instead of relying on it
        cd "${MONITOR_PATH}"
        # the snyk command of the setup action is a wrapper that passes its arguments through eval
        snyk-linux monitor "${options[@]}" -- -I "${GITHUB_ACTION_PATH}/strict-resolution.gradle" --no-scan
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
        ORG: ${{ inputs.org }}
        PROJECT_NAME: ${{ inputs.project-name }}
        SUB_PROJECT: ${{ inputs.sub-project }}
        REMOTE_REPO_URL: ${{ inputs.remote-repo-url }}
        PROJECT_LIFECYCLE: ${{ inputs.project-lifecycle }}
        TARGET_REFERENCE: ${{ inputs.target-reference }}
        MONITOR_PATH: ${{ inputs.path }}
        BUILD_FILE: ${{ steps.validate.outputs.build-file }}
        CONFIGURATION_MATCHING: ${{ inputs.configuration-matching }}
